<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Puzzle Lens</title>
    <meta name="description" content="Read a twisty puzzle (Maltese Gear Cube, Tangram Cube Extreme) from photos, check it on a 3D model, and follow the solver's solution move by move." />
    <meta name="theme-color" content="#f8f9fc" />
    <script>
      // Apply the saved theme before first paint (light unless dark was chosen), as on the 3D simulator site.
      (function () {
        var t = 'light';
        try {
          t = localStorage.getItem('theme-choice') || 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" title="Toggle light / dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <div id="app" class="scanner">
      <div class="workspace">
        <nav class="steps" id="steps" aria-label="Steps"></nav>
        <main class="work" id="work"></main>
      </div>
      <!-- The side panel sits left of the work area (grid areas in app.css); drag this to resize it. -->
      <div class="resizer" id="panel-resizer" role="separator" aria-orientation="vertical" aria-controls="panel" aria-label="Resize the side panel" title="Drag to resize the panel (double-click to reset)" tabindex="0"></div>
      <aside class="panel" id="panel"></aside>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
